<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Labirinto</title>
   <link rel="stylesheet" href="../assets/styles/main.css">
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
   
   <script type="text/javascript" src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
   <script src="/socket.io/socket.io.js"></script>
</head>
<body>
   <p id="points"> voce tem mts ponto</p>
   <canvas id="screen" width="25" height="25" ></canvas>

   <div id="controles">
      
      <button class="mov-control" data-direction="ArrowUp">
          <span  class="material-symbols-outlined  seta" translate="no">
             arrow_upward
          </span> 
       </button>
       
       <div class="lados">
          <button class="mov-control" data-direction="ArrowLeft">
             <span  class="material-symbols-outlined  seta" translate="no">
                arrow_back
             </span>
          </button>
          
          <button class="mov-control" data-direction="ArrowRight">
             <span  class="material-symbols-outlined  seta" translate="no">
             arrow_right_alt
          </span>
          </button>
       </div>
       
       <button class="mov-control" data-direction="ArrowDown">
          <span  class="material-symbols-outlined  seta" translate="no">
             arrow_downward
          </span>
       </button>

   </div>

<script type="module" >
import createKeyboardListener from '../assets/scripts/keyboardListener.js'
import renderScreen from '../assets/scripts/render.js'
import createGame from '../assets/scripts/rules.js'

const game = createGame()
const canvaElement = document.getElementById('screen')
const screen = canvaElement.getContext('2d')
const keyboardListener = createKeyboardListener(document);

const socket = io()

socket.on('connect', () => {
   const playerId = socket.id
   renderScreen(screen,game,requestAnimationFrame, playerId )
})

socket.on('setup', (state)=>{
   const playerId = socket.id
   game.setState(state)
   
   keyboardListener.registerPlayerId(playerId)
   keyboardListener.subscribe(game.movePlayer)
   keyboardListener.subscribe((command)=>{
      socket.emit('move-player', command)
   })
   
})

socket.on('add-player', (command)=>{
   // console.log(`> receiving ${command.type} --> ${command.playerId}`)
   game.addPlayer(command)
})

socket.on('remove-player', (command)=>{
   console.log(`> receiving ${command.type} --> ${command.playerId}`)
   game.removePlayer(command)
})

socket.on('move-player', (command)=>{
   // console.log(`> receiving ${command.type} --> ${command.playerId}`)
   const playerId = socket.id
   
   if(playerId !== command.playerId){
      game.movePlayer(command)
   }
   
})

let moveInterval = null

function startMoving(direction) {
   const command = { key: direction }
   keyboardListener.handleKeydown(command)
   moveInterval = setInterval(() => {
      keyboardListener.handleKeydown(command)
   }, 120)
}

function stopMoving() {
   if (moveInterval) {
      clearInterval(moveInterval)
      moveInterval = null
   }
}

document.querySelectorAll('.mov-control').forEach(btn => {
   const direction = btn.dataset.direction

   btn.addEventListener('mousedown', () => startMoving(direction))
   btn.addEventListener('mouseup', stopMoving)
   btn.addEventListener('mouseleave', stopMoving)
   btn.addEventListener('touchstart', (e) => {
      e.preventDefault()
      startMoving(direction)
   })
   btn.addEventListener('touchend', (e) => {
      e.preventDefault()
      stopMoving()
   })
})
</script>
</body>
</html>
