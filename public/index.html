<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Labirinto</title>
   <link rel="stylesheet" href="../assets/styles/main.css">
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
   
   <script type="text/javascript" src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
   <script src="/socket.io/socket.io.js"></script>
</head>
<body>
   <div id="login-screen">
      <h1>Labirinto</h1>
      <input id="name-input" type="text" placeholder="seu nome" maxlength="12" autocomplete="off">
      <select id="map-select">
         <option value="world1">Mundo 1</option>
         <option value="world2">Mundo 2</option>
         <option value="world3" selected>Mundo 3</option>
         <option value="world4">Mundo 4</option>
         <option value="world5">Mundo 5</option>
         <option value="world6">Mundo 6</option>
      </select>
      <canvas id="map-preview" width="200" height="200"></canvas>
      <button id="new-game">Novo jogo</button>
      <button id="host-game">Hostear jogo</button>
      <div class="login-join">
         <input id="room-code-input" type="text" placeholder="codigo da sala" maxlength="5" autocomplete="off">
         <button id="join-room">Entrar em um jogo</button>
      </div>
      <p id="login-error"></p>
   </div>

   <div id="game-screen" class="hidden">
      <p id="points"> voce tem mts ponto</p>
      <p id="player-name-display"></p>
      <p id="room-code-display"></p>
      <button id="leave-game">Sair</button>
      <canvas id="screen" width="25" height="25" ></canvas>

      <div id="controles">
         
         <button class="mov-control" data-direction="ArrowUp">
             <span  class="material-symbols-outlined  seta" translate="no">
                arrow_upward
             </span> 
          </button>
          
          <div class="lados">
             <button class="mov-control" data-direction="ArrowLeft">
                <span  class="material-symbols-outlined  seta" translate="no">
                   arrow_back
                </span>
             </button>
             
             <button class="mov-control" data-direction="ArrowRight">
                <span  class="material-symbols-outlined  seta" translate="no">
                arrow_right_alt
             </span>
             </button>
          </div>
          
          <button class="mov-control" data-direction="ArrowDown">
             <span  class="material-symbols-outlined  seta" translate="no">
                arrow_downward
             </span>
          </button>

      </div>

   </div>

<script type="module" >
import createKeyboardListener from '../assets/scripts/keyboardListener.js'
import renderScreen, { drawTiles, TILE_SIZE } from '../assets/scripts/render.js'
import createGame from '../assets/scripts/rules.js'

const game = createGame()
const canvaElement = document.getElementById('screen')
const screen = canvaElement.getContext('2d')
const keyboardListener = createKeyboardListener(document);

const loginScreen = document.getElementById('login-screen')
const gameScreen = document.getElementById('game-screen')
const roomCodeDisplay = document.getElementById('room-code-display')
const loginError = document.getElementById('login-error')
const roomCodeInput = document.getElementById('room-code-input')
const nameInput = document.getElementById('name-input')
const mapSelect = document.getElementById('map-select')
const mapPreview = document.getElementById('map-preview')
const playerNameDisplay = document.getElementById('player-name-display')

const socket = io()

let rendering = false
let worlds = []

function currentName() {
   return nameInput.value.trim()
}

async function loadWorlds() {
   try {
      const response = await fetch('/api/worlds')
      worlds = await response.json()
      mapSelect.innerHTML = ''
      for (const world of worlds) {
         const option = document.createElement('option')
         option.value = world.id
         option.textContent = world.name
         mapSelect.appendChild(option)
      }
   } catch {
      worlds = []
   }
   renderPreview()
}

function renderPreview() {
   const ctx = mapPreview.getContext('2d')
   ctx.fillStyle = 'white'
   ctx.fillRect(0, 0, mapPreview.width, mapPreview.height)
   const world = worlds.find(w => w.id === mapSelect.value)
   const size = world?.state?.screen
   if(!size?.width || !size?.height) return
   const scale = mapPreview.width / (TILE_SIZE * Math.max(size.width, size.height))
   drawTiles(ctx, world.state, scale, { walls: 'rgb(45, 45, 45)' })
}

mapSelect.addEventListener('change', renderPreview)
loadWorlds()

document.getElementById('new-game').addEventListener('click', () => {
   socket.emit('create-room', { mode: 'single', map: mapSelect.value, name: currentName() })
})

document.getElementById('host-game').addEventListener('click', () => {
   socket.emit('create-room', { mode: 'online', map: mapSelect.value, name: currentName() })
})

document.getElementById('join-room').addEventListener('click', () => {
   const code = roomCodeInput.value.trim().toUpperCase()
   if(!code) return
   socket.emit('join-room', { code, name: currentName() })
})

document.getElementById('leave-game').addEventListener('click', () => {
   socket.disconnect()
   location.reload()
})

roomCodeInput.addEventListener('keydown', (event) => {
   if(event.key === 'Enter'){
      document.getElementById('join-room').click()
   }
})

socket.on('setup', ({ code, state }) => {
   const playerId = socket.id
   game.setState(state)
   roomCodeDisplay.textContent = state.mode === 'single' ? '' : `Sala: ${code}`
   roomCodeDisplay.style.display = state.mode === 'single' ? 'none' : 'block'
   playerNameDisplay.textContent = `Jogando como: ${state.players[playerId]?.name || ''}`
   loginScreen.classList.add('hidden')
   gameScreen.classList.remove('hidden')

   keyboardListener.registerPlayerId(playerId)
   keyboardListener.subscribe(game.movePlayer)
   keyboardListener.subscribe((command)=>{
      socket.emit('move-player', command)
   })

   if(!rendering){
      renderScreen(screen, game, requestAnimationFrame, playerId)
      rendering = true
   }
})

socket.on('room-not-found', ({ code }) => {
   loginError.textContent = `sala ${code} nao encontrada`
})

socket.on('add-player', (command)=>{
   game.addPlayer(command)
})

socket.on('remove-player', (command)=>{
   console.log(`> receiving ${command.type} --> ${command.playerId}`)
   game.removePlayer(command)
})

socket.on('move-player', (command)=>{
   const playerId = socket.id
   
   if(playerId !== command.playerId){
      game.movePlayer(command)
   }
   
})

socket.on('tick', () => {
   game.tick()
})

let moveInterval = null

function startMoving(direction) {
   const command = { key: direction }
   keyboardListener.handleKeydown(command)
   moveInterval = setInterval(() => {
      keyboardListener.handleKeydown(command)
   }, 120)
}

function stopMoving() {
   if (moveInterval) {
      clearInterval(moveInterval)
      moveInterval = null
   }
}

document.querySelectorAll('.mov-control').forEach(btn => {
   const direction = btn.dataset.direction

   btn.addEventListener('mousedown', () => startMoving(direction))
   btn.addEventListener('mouseup', stopMoving)
   btn.addEventListener('mouseleave', stopMoving)
   btn.addEventListener('touchstart', (e) => {
      e.preventDefault()
      startMoving(direction)
   })
   btn.addEventListener('touchend', (e) => {
      e.preventDefault()
      stopMoving()
   })
})
</script>
</body>
</html>
